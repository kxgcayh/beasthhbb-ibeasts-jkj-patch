"fomod/info.xml" = "fomod/info.xml"
"fomod/ModuleConfig.xml" = "fomod/ModuleConfig.xml"
"beast/aio-default/BeastHHBB iBeasts - JKJ Patch.esp" = "dist/BeastHHBB and iBeasts - Project ja-Kha'jay Patch/beast/aio-default/BeastHHBB iBeasts - JKJ Patch.esp"
