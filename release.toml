name = "BeastHHBB-iBeasts-JKJ-Patch"
display_name = "BeastHHBB and iBeasts - Project ja-Kha'jay Patch"
version = "1.1"
description = "Fixes headless or wrong-faced Khajiit when Project ja-Kha'jay is installed with iBeasts - Interesting Npcs replacer and BeastHHBB. ESL-flagged plugin only, no assets."

# archive path = source path (relative to this folder); dist/ is written by: python3 build.py --write
# The FOMOD is laid out flat (fomod/ plus one folder per option) so MO2 runs the installer on the release zip itself.
